<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArcQSO account</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="rail">
    <a class="rail-brand" href="./"><img src="./assets/mark.svg" alt="">Arc<b>QSO</b></a>
    <nav><a href="./#buy">Plans</a><a href="./account.html">Account</a></nav>
    <div class="tx"><i class="led"></i> ACCOUNT</div>
  </div>
  <main class="frame account-page">
    <section id="auth-panel" class="ticket account-card">
      <header><span>Station desk</span><span>ArcQSO</span></header>
      <h2 id="auth-title">Sign in</h2>
      <p class="muted" id="auth-lead">Same account for the website and the desktop license check.</p>
      <form id="auth-form">
        <label>Email<input type="email" name="email" required autocomplete="email"></label>
        <label>Password<input type="password" name="password" required minlength="8" autocomplete="current-password"></label>
        <label id="call-row" hidden>Callsign<input type="text" name="callsign" maxlength="12" autocomplete="off"></label>
        <p class="err" id="auth-err" hidden></p>
        <button class="btn btn-go" type="submit" id="auth-submit">Sign in</button>
      </form>
      <p class="switch"><button type="button" id="toggle-auth">Need an account? Create one</button></p>
    </section>
    <section id="desk" class="account-desk" hidden>
      <div class="ticket account-card">
        <header><span>Profile</span><span id="license-chip">license</span></header>
        <div class="profile-row">
          <img id="avatar" alt="" src="./assets/mark.svg">
          <div><h2 id="hello">Account</h2><p class="muted" id="email-line"></p></div>
        </div>
        <form id="profile-form">
          <label>Callsign<input type="text" name="callsign" maxlength="12"></label>
          <label>Name<input type="text" name="name" maxlength="80"></label>
          <label>Profile photo<input type="file" id="photo" accept="image/jpeg,image/png,image/webp"></label>
          <button class="btn btn-go" type="submit">Save profile</button>
        </form>
        <p class="muted mono" id="key-line"></p>
      </div>
      <div class="ticket account-card">
        <header><span>Subscription</span><span>$9.99 / $4.99 a year</span></header>
        <p class="muted" id="plan-line">No active plan yet.</p>
        <div class="buy-row">
          <button class="btn btn-go" data-plan="desktop" type="button">Desktop — $9.99 / year</button>
          <button class="btn btn-ghost dark" data-plan="mobile" type="button">Mobile — $4.99 / year</button>
        </div>
        <button class="btn btn-ghost dark" id="portal-btn" type="button">Update card or cancel</button>
        <p class="err" id="bill-err" hidden></p>
        <p class="muted">Stripe Customer Portal handles the card, invoices and cancellation.</p>
      </div>
      <p><button class="btn btn-ghost" id="logout" type="button">Sign out</button></p>
    </section>
  </main>
  <script src="./account.js"></script>
</body>
</html>
